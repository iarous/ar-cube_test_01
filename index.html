<!DOCTYPE html>
<html>
  <head>
    <title>AR Cube - Multi Model</title>
    <meta charset="utf-8">
    
    <!-- Bibliotheken -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

    <style>
      /* UI-Buttons am unteren Rand */
      #model-selector {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        display: flex;
        gap: 10px;
      }
      
      .model-btn {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: 2px solid white;
        padding: 12px 20px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
      }
      
      .model-btn:active {
        background: rgba(255, 255, 255, 0.9);
        color: black;
      }
      
      .model-btn.active {
        background: white;
        color: black;
      }
    </style>

    <script>
      // Aktuelles Modell speichern
      let currentModel = './model_01.glb';

      // Funktion zum Wechseln des Modells
      function switchModel(modelPath, buttonId) {
        currentModel = modelPath;
        
        // Alle Marker durchgehen und Modell austauschen
        const allMarkers = document.querySelectorAll('.cubemarker');
        allMarkers.forEach(marker => {
          const entity = marker.querySelector('a-entity');
          if (entity) {
            // Modell neu setzen
            entity.setAttribute('gltf-model', modelPath);
          }
        });
        
        // Button-Highlight aktualisieren
        document.querySelectorAll('.model-btn').forEach(btn => {
          btn.classList.remove('active');
        });
        document.getElementById(buttonId).classList.add('active');
      }

      // ========================================
      // COMPONENT 1: Cube-Mode
      // ========================================
      AFRAME.registerComponent('cube-mode', {
        tick: function () {
          var allMarkers = document.querySelectorAll('.cubemarker');
          var winnerFound = false;

          for (var i = 0; i < allMarkers.length; i++) {
            var marker = allMarkers[i];
            var model = marker.querySelector('a-entity');

            if (marker.object3D.visible) {
              if (!winnerFound) {
                model.setAttribute('visible', 'true');
                
                var mixer = model.components['animation-mixer'];
                if (mixer && mixer.mixer) {
                  mixer.mixer.timeScale = 1;
                }
                
                winnerFound = true;
              } else {
                model.setAttribute('visible', 'false');
              }
            } else {
              model.setAttribute('visible', 'true');
            }
          }
        }
      });

      // ========================================
      // COMPONENT 2: Flat Material
      // ========================================
      AFRAME.registerComponent('flat-material', {
        init: function() {
          const el = this.el;
          
          // Listener für Modell-Wechsel
          el.addEventListener('model-loaded', () => {
            const mesh = el.getObject3D('mesh');
            if (mesh) {
              mesh.traverse((node) => {
                if (node.isMesh && node.material) {
                  node.material.metalness = 0;
                  node.material.roughness = 1;
                  node.material.needsUpdate = true;
                }
              });
            }
          });
        }
      });
    </script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    
    <!-- UI: Model-Selector Buttons -->
    <div id="model-selector">
      <button class="model-btn active" id="btn-model_01" onclick="switchModel('./model_01.glb', 'btn-model_01')">
        🚀 model_01
      </button>
      <button class="model-btn" id="btn-model_02" onclick="switchModel('./model_02.glb', 'btn-model_02')">
        🛸 Rakete
      </button>
      <button class="model-btn" id="btn-model_03" onclick="switchModel('./model_03.glb', 'btn-model_03')">
        👽 model_03
      </button>
    </div>

    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" 
      cube-mode>

      <!-- ALLE Modelle vorladen (wichtig für schnellen Wechsel) -->
      <a-assets>
          <a-asset-item id="model-model_01" src="./model_01.glb"></a-asset-item>
          <a-asset-item id="model-model_02" src="./model_02.glb"></a-asset-item>
          <a-asset-item id="model-model_03" src="./model_03.glb"></a-asset-item>
      </a-assets>

      <!-- ========================================
           MARKER 0 (Vorderseite)
           ======================================== -->
      <a-marker 
        class="cubemarker" 
        type="barcode" 
        value="0" 
        smooth="true" 
        smoothCount="10" 
        smoothTolerance="0.01" 
        smoothThreshold="5">
        <a-entity 
          gltf-model="./model_01.glb"
          scale="1 1 1" 
          position="0 -0.8 0" 
          rotation="0 0 0"
          animation-mixer
          flat-material>
        </a-entity>
      </a-marker>

      <!-- ========================================
           MARKER 1 (Rechte Seite)
           ======================================== -->
      <a-marker 
        class="cubemarker" 
        type="barcode" 
        value="1" 
        smooth="true" 
        smoothCount="10" 
        smoothTolerance="0.01" 
        smoothThreshold="5">
        <a-entity 
          gltf-model="./model_01.glb"
          scale="1 1 1" 
          position="0 -0.8 0" 
          rotation="0 -90 90"
          animation-mixer
          flat-material>
        </a-entity>
      </a-marker>

      <!-- ========================================
           MARKER 2 (Rückseite)
           ======================================== -->
      <a-marker 
        class="cubemarker" 
        type="barcode" 
        value="2" 
        smooth="true" 
        smoothCount="10" 
        smoothTolerance="0.01" 
        smoothThreshold="5">
        <a-entity 
          gltf-model="./model_01.glb"
          scale="1 1 1" 
          position="0 -0.8 0" 
          rotation="0 0 180"
          animation-mixer
          flat-material>
        </a-entity>
      </a-marker>

      <!-- ========================================
           MARKER 3 (Linke Seite)
           ======================================== -->
      <a-marker 
        class="cubemarker" 
        type="barcode" 
        value="3" 
        smooth="true" 
        smoothCount="10" 
        smoothTolerance="0.01" 
        smoothThreshold="5">
        <a-entity 
          gltf-model="./model_01.glb"
          scale="1 1 1" 
          position="0 -0.8 0" 
          rotation="0 0 -90"
          animation-mixer
          flat-material>
        </a-entity>
      </a-marker>

      <!-- ========================================
           MARKER 4 (Oberseite)
           ======================================== -->
      <a-marker 
        class="cubemarker" 
        type="barcode" 
        value="4" 
        smooth="true" 
        smoothCount="10" 
        smoothTolerance="0.01" 
        smoothThreshold="5">
        <a-entity 
          gltf-model="./model_01.glb"
          scale="1 1 1" 
          position="0 -0.8 0" 
          rotation="90 0 0"
          animation-mixer
          flat-material>
        </a-entity>
      </a-marker>

      <!-- ========================================
           MARKER 5 (Unterseite)
           ======================================== -->
      <a-marker 
        class="cubemarker" 
        type="barcode" 
        value="5" 
        smooth="true" 
        smoothCount="10" 
        smoothTolerance="0.01" 
        smoothThreshold="5">
        <a-entity 
          gltf-model="./model_01.glb"
          scale="1 1 1" 
          position="0 -0.8 0" 
          rotation="-90 0 0"
          animation-mixer
          flat-material>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
