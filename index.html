<!DOCTYPE html>
<html>
  <head>
    <title>AR Cube</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- Bibliotheken -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      /* WICHTIG FÜR KAMERA-FIX: Kein Overflow/Width auf Body erzwingen, AR.js regelt das */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      /* AR Scene Styling */
      a-scene {
        position: absolute;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
      }

      /* ─── Model-Switcher UI ─── */
      #model-selector {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        display: flex;
        gap: 8px;
        padding: 8px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 999px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      }

      .model-btn {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1.5px solid rgba(255, 255, 255, 0.2);
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
        white-space: nowrap;
        letter-spacing: 0.03em;
        min-height: 44px;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      .model-btn.active {
        background: rgba(255, 255, 255, 0.95);
        color: #111;
        border-color: #fff;
      }

      .model-btn:active {
        transform: scale(0.94);
      }
    </style>

    <script>
      var currentModelSrc = './model_01.glb';

      function switchModel(modelPath, btnId) {
        currentModelSrc = modelPath;

        var entities = document.querySelectorAll('.cube-entity');
        entities.forEach(function(entity) {
          entity.setAttribute('gltf-model', modelPath);
        });

        document.querySelectorAll('.model-btn').forEach(function(btn) {
          btn.classList.remove('active');
        });
        var activeBtn = document.getElementById(btnId);
        if (activeBtn) activeBtn.classList.add('active');
      }

      AFRAME.registerComponent('cube-mode', {
        tick: function () {
          var allMarkers = document.querySelectorAll('.cubemarker');
          var winnerFound = false;

          for (var i = 0; i < allMarkers.length; i++) {
            var marker = allMarkers[i];
            var entity = marker.querySelector('a-entity');
            if (!entity) continue;

            if (marker.object3D.visible) {
              if (!winnerFound) {
                entity.setAttribute('visible', 'true');
                var mixer = entity.components['animation-mixer'];
                if (mixer && mixer.mixer) {
                  mixer.mixer.timeScale = 1;
                }
                winnerFound = true;
              } else {
                entity.setAttribute('visible', 'false');
              }
            } else {
              entity.setAttribute('visible', 'true');
            }
          }
        }
      });

      AFRAME.registerComponent('flat-material', {
        init: function () {
          var el = this.el;
          el.addEventListener('model-loaded', function () {
            var mesh = el.getObject3D('mesh');
            if (!mesh) return;
            mesh.traverse(function (node) {
              if (node.isMesh && node.material) {
                node.material.metalness = 0;
                node.material.roughness = 1;
                node.material.needsUpdate = true;
              }
            });
          });
        }
      });
    </script>
  </head>

  <body>

    <div id="model-selector">
      <button class="model-btn active" id="btn-01" onclick="switchModel('./model_01.glb', 'btn-01')">Modell 1</button>
      <button class="model-btn" id="btn-02" onclick="switchModel('./model_02.glb', 'btn-02')">Modell 2</button>
      <button class="model-btn" id="btn-03" onclick="switchModel('./model_03.glb', 'btn-03')">Modell 3</button>
    </div>

    <!-- KAMERA-FIX: embedded hinzugefügt, renderer='alpha: true' gesetzt -->
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
      renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
      cube-mode
      vr-mode-ui="enabled: false"
      loading-screen="enabled: false">

      <!-- Marker 0 -->
      <a-marker class="cubemarker" type="barcode" value="0" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-entity class="cube-entity" gltf-model="./model_01.glb" scale="1 1 1" position="0 -0.8 0" rotation="0 0 0" animation-mixer flat-material></a-entity>
      </a-marker>

      <!-- Marker 1 -->
      <a-marker class="cubemarker" type="barcode" value="1" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-entity class="cube-entity" gltf-model="./model_01.glb" scale="1 1 1" position="0 -0.8 0" rotation="0 -90 90" animation-mixer flat-material></a-entity>
      </a-marker>

      <!-- Marker 2 -->
      <a-marker class="cubemarker" type="barcode" value="2" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-entity class="cube-entity" gltf-model="./model_01.glb" scale="1 1 1" position="0 -0.8 0" rotation="0 0 180" animation-mixer flat-material></a-entity>
      </a-marker>

      <!-- Marker 3 -->
      <a-marker class="cubemarker" type="barcode" value="3" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-entity class="cube-entity" gltf-model="./model_01.glb" scale="1 1 1" position="0 -0.8 0" rotation="0 0 -90" animation-mixer flat-material></a-entity>
      </a-marker>

      <!-- Marker 4 -->
      <a-marker class="cubemarker" type="barcode" value="4" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-entity class="cube-entity" gltf-model="./model_01.glb" scale="1 1 1" position="0 -0.8 0" rotation="90 0 0" animation-mixer flat-material></a-entity>
      </a-marker>

      <!-- Marker 5 -->
      <a-marker class="cubemarker" type="barcode" value="5" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-entity class="cube-entity" gltf-model="./model_01.glb" scale="1 1 1" position="0 -0.8 0" rotation="-90 0 0" animation-mixer flat-material></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

  </body>
</html>
