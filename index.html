<!DOCTYPE html>
<html>
<head>
    <title>AR Cube - Multi Model</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bibliotheken -->
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

<style>
      /* UI-Buttons am unteren Rand */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        overflow: hidden;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      /* AR Scene füllt den gesamten Bildschirm */
      a-scene {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
      }

      /* ─── Model-Switcher UI ─── */
#model-selector {
position: fixed;
        bottom: 20px;
        bottom: 28px;
left: 50%;
transform: translateX(-50%);
        z-index: 999;
        z-index: 9999;
display: flex;
        gap: 10px;
        gap: 8px;
        padding: 8px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 999px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
}
      

.model-btn {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: 2px solid white;
        padding: 12px 20px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1.5px solid rgba(255, 255, 255, 0.2);
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 999px;
cursor: pointer;
        transition: all 0.3s;
      }
      
      .model-btn:active {
        background: rgba(255, 255, 255, 0.9);
        color: black;
        transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
        white-space: nowrap;
        letter-spacing: 0.03em;
        min-height: 44px; /* Touch-Target >= 44px */
        -webkit-tap-highlight-color: transparent;
        user-select: none;
}
      

.model-btn.active {
        background: white;
        color: black;
        background: rgba(255, 255, 255, 0.95);
        color: #111;
        border-color: #fff;
      }

      .model-btn:active {
        transform: scale(0.94);
}
</style>

<script>
      // Aktuelles Modell speichern
      let currentModel = './model_01.glb';
      // ============================================================
      // Aktuell gewähltes Modell (Standard: model_01.glb)
      // Dateinamen: model_01.glb, model_02.glb, model_03.glb
      // ============================================================
      var currentModelSrc = './model_01.glb';

      // Funktion zum Wechseln des Modells
      function switchModel(modelPath, buttonId) {
        currentModel = modelPath;
        
        // Alle Marker durchgehen und Modell austauschen
        const allMarkers = document.querySelectorAll('.cubemarker');
        allMarkers.forEach(marker => {
          const entity = marker.querySelector('a-entity');
          if (entity) {
            // Modell neu setzen
            entity.setAttribute('gltf-model', modelPath);
          }
      function switchModel(modelPath, btnId) {
        currentModelSrc = modelPath;

        // Alle 6 Marker-Entities updaten
        var entities = document.querySelectorAll('.cube-entity');
        entities.forEach(function(entity) {
          entity.setAttribute('gltf-model', modelPath);
});
        

// Button-Highlight aktualisieren
        document.querySelectorAll('.model-btn').forEach(btn => {
        document.querySelectorAll('.model-btn').forEach(function(btn) {
btn.classList.remove('active');
});
        document.getElementById(buttonId).classList.add('active');
        var activeBtn = document.getElementById(btnId);
        if (activeBtn) activeBtn.classList.add('active');
}

      // ========================================
      // COMPONENT 1: Cube-Mode
      // ========================================
      // ============================================================
      // COMPONENT: cube-mode
      // Zeigt immer nur ein Modell gleichzeitig (erstes sichtbares
      // Marker "gewinnt"), verhindert Doppeldarstellung.
      // ============================================================
AFRAME.registerComponent('cube-mode', {
tick: function () {
var allMarkers = document.querySelectorAll('.cubemarker');
var winnerFound = false;

for (var i = 0; i < allMarkers.length; i++) {
var marker = allMarkers[i];
            var model = marker.querySelector('a-entity');
            var entity = marker.querySelector('a-entity');
            if (!entity) continue;

if (marker.object3D.visible) {
if (!winnerFound) {
                model.setAttribute('visible', 'true');
                
                var mixer = model.components['animation-mixer'];
                entity.setAttribute('visible', 'true');
                // Animation manuell anstoßen, falls sie nicht automatisch startet
                var mixer = entity.components['animation-mixer'];
if (mixer && mixer.mixer) {
mixer.mixer.timeScale = 1;
}
                
winnerFound = true;
} else {
                model.setAttribute('visible', 'false');
                entity.setAttribute('visible', 'false');
}
} else {
              model.setAttribute('visible', 'true');
              // Marker nicht sichtbar → Modell bereit halten für Wiedererkennung
              entity.setAttribute('visible', 'true');
}
}
}
});

      // ========================================
      // COMPONENT 2: Flat Material
      // ========================================
      // ============================================================
      // COMPONENT: flat-material
      // Entfernt Glanz und Reflexionen vom 3D-Modell.
      // Wird bei jedem Modell-Wechsel automatisch neu ausgeführt.
      // ============================================================
AFRAME.registerComponent('flat-material', {
        init: function() {
          const el = this.el;
          
          // Listener für Modell-Wechsel
          el.addEventListener('model-loaded', () => {
            const mesh = el.getObject3D('mesh');
            if (mesh) {
              mesh.traverse((node) => {
                if (node.isMesh && node.material) {
                  node.material.metalness = 0;
                  node.material.roughness = 1;
                  node.material.needsUpdate = true;
                }
              });
            }
        init: function () {
          var el = this.el;
          el.addEventListener('model-loaded', function () {
            var mesh = el.getObject3D('mesh');
            if (!mesh) return;
            mesh.traverse(function (node) {
              if (node.isMesh && node.material) {
                node.material.metalness = 0;   // Kein Metall-Look
                node.material.roughness = 1;   // Maximale Mattheit
                node.material.needsUpdate = true;
              }
            });
});
}
});
</script>
</head>

  <body style="margin: 0px; overflow: hidden;">

    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" 
      cube-mode>
    <!-- ============================================================
         AR-SZENE

         per switchModel() ausgetauscht.
    ============================================================ -->

      embedded
      arjs="sourceType: webcam;
            debugUIEnabled: false;
            detectionMode: mono_and_matrix;
            matrixCodeType: 3x3;"
      cube-mode
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
      loading-screen="enabled: false">

      <!-- ALLE Modelle vorladen (wichtig für schnellen Wechsel) -->
      <a-assets>
          <a-asset-item id="model-model_01" src="./model_01.glb"></a-asset-item>
          <a-asset-item id="model-model_02" src="./model_02.glb"></a-asset-item>
          <a-asset-item id="model-model_03" src="./model_03.glb"></a-asset-item>
      </a-assets>
