<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Viewer</title>

  <!-- NUR diese zwei Scripts – kein aframe-extras! -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    .ui-overlay {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      display: flex;
      gap: 12px;
      padding: 20px 16px;
      justify-content: center;
      background: linear-gradient(transparent, rgba(0,0,0,0.5));
    }

    .model-btn {
      padding: 12px 22px;
      border: 2px solid rgba(255,255,255,0.55);
      border-radius: 999px;
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 14px;
      font-family: system-ui, sans-serif;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      -webkit-tap-highlight-color: transparent;
      transition: background 0.18s, border-color 0.18s;
    }

    .model-btn.active {
      background: rgba(255,255,255,0.92);
      color: #111;
      border-color: #fff;
    }

    .model-btn:active { transform: scale(0.93); }

    #debug-info {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 9999;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="debug-info">🔍 Marker suchen...</div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="antialias: true; alpha: true;"
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
  >
    <a-marker
      preset="hiro"
      id="hiro-marker"
      smooth="true"
      smoothCount="5"
      smoothTolerance="0.01"
      smoothThreshold="2"
    >
      <!-- Test-Würfel: Zeigt ob Marker erkannt wird -->
      <a-box
        position="0 0.15 0"
        scale="0.2 0.2 0.2"
        color="#00aaff"
        opacity="0.4"
        material="transparent: true;"
      ></a-box>

      <!-- 3D Modell -->
      <a-entity
        id="ar-model"
        gltf-model="url(./model_01.glb)"
        scale="0.5 0.5 0.5"
        position="0 0 0"
        rotation="0 0 0"
      ></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <div class="ui-overlay">
    <button class="model-btn active" id="btn-01"
      onclick="switchModel('./model_01.glb', 'btn-01')">Modell 1</button>
    <button class="model-btn" id="btn-02"
      onclick="switchModel('./model_02.glb', 'btn-02')">Modell 2</button>
    <button class="model-btn" id="btn-03"
      onclick="switchModel('./model_03.glb', 'btn-03')">Modell 3</button>
  </div>

  <script>
    // Marker-Status anzeigen
    var marker = document.getElementById('hiro-marker');
    var debugEl = document.getElementById('debug-info');

    marker.addEventListener('markerFound', function() {
      debugEl.textContent = '✅ Marker erkannt!';
      debugEl.style.background = 'rgba(0,140,0,0.7)';
    });

    marker.addEventListener('markerLost', function() {
      debugEl.textContent = '🔍 Marker suchen...';
      debugEl.style.background = 'rgba(0,0,0,0.6)';
    });

    // Modell wechseln
    function switchModel(path, btnId) {
      var entity = document.getElementById('ar-model');

      entity.removeAttribute('gltf-model');

      setTimeout(function() {
        entity.setAttribute('gltf-model', 'url(' + path + ')');
      }, 150);

      document.querySelectorAll('.model-btn').forEach(function(btn) {
        btn.classList.remove('active');
      });
      document.getElementById(btnId).classList.add('active');
    }
  </script>

</body>
</html>
