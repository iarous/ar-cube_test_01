<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Viewer</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

  <style>
    /* ── Reset: kritisch für korrekte Kamera-Darstellung ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /*
      Das ist die Hauptursache für Zoom/Verzerrung:
      A-Frame setzt das Canvas ohne embedded-Attribut falsch.
      Zusätzlich muss das Video-Element korrekt skaliert sein.
    */
    .a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }

    /* AR.js Video-Feed: kein object-fit, damit keine künstliche Vergrößerung */
    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: -1 !important;
    }

    /* ── UI Overlay ── */
    #ui-overlay {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: flex-end;
      padding: 16px 16px 28px;
      background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, transparent 100%);
      pointer-events: none;
    }

    .model-btn {
      pointer-events: all;
      flex: 1;
      max-width: 110px;
      min-height: 48px;
      padding: 10px 6px;
      border-radius: 14px;
      border: 1.5px solid rgba(255,255,255,0.25);
      background: rgba(20, 20, 20, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .model-btn.active {
      background: rgba(255,255,255,0.22);
      border-color: rgba(255,255,255,0.65);
    }

    .model-btn:active {
      transform: scale(0.94);
    }

    /* Marker-Hinweis oben */
    #hint {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      font-size: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="hint">📷 Hiro-Marker scannen</div>

  <!--
    WICHTIG: Das "embedded"-Attribut ist zwingend erforderlich!
    Ohne "embedded" rendert A-Frame das Canvas außerhalb des normalen
    Document-Flows → Kamera erscheint gezoomt/verzerrt.
  -->
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium; antialias: true; alpha: true;"
    loading-screen="enabled: false"
  >

    <a-marker preset="hiro" id="marker" smooth="true" smoothCount="5" smoothTolerance="0.01">
      <a-entity
        id="ar-model"
        gltf-model="./model_01.glb"
        scale="0.5 0.5 0.5"
        position="0 0 0"
        rotation="0 0 0"
        animation-mixer="loop: repeat; clampWhenFinished: false;"
      ></a-entity>
    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <!-- UI Buttons -->
  <div id="ui-overlay">
    <button class="model-btn active" id="btn-1" onclick="switchModel('./model_01.glb', 'btn-1')">Modell 1</button>
    <button class="model-btn"        id="btn-2" onclick="switchModel('./model_02.glb', 'btn-2')">Modell 2</button>
    <button class="model-btn"        id="btn-3" onclick="switchModel('./model_03.glb', 'btn-3')">Modell 3</button>
  </div>

  <script>
    // Aktives Modell wechseln – Dateiname bleibt immer model_01/02/03.glb
    function switchModel(path, activeBtnId) {
      var model = document.getElementById('ar-model');
      if (model) {
        model.setAttribute('gltf-model', path);
        // Animation-Mixer neu starten nach Modellwechsel
        model.removeAttribute('animation-mixer');
        setTimeout(function() {
          model.setAttribute('animation-mixer', 'loop: repeat; clampWhenFinished: false;');
        }, 300);
      }
      document.querySelectorAll('.model-btn').forEach(function(btn) {
        btn.classList.remove('active');
      });
      document.getElementById(activeBtnId).classList.add('active');
    }

    // Marker-Hinweis ausblenden sobald Marker erkannt wird
    document.addEventListener('DOMContentLoaded', function() {
      var marker = document.getElementById('marker');
      var hint = document.getElementById('hint');
      if (marker && hint) {
        marker.addEventListener('markerFound', function() {
          hint.style.opacity = '0';
          hint.style.transition = 'opacity 0.4s';
        });
        marker.addEventListener('markerLost', function() {
          hint.style.opacity = '1';
        });
      }
    });
  </script>

</body>
</html>
